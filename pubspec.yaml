name: shroudy_tv
description: "Shroudy TV iPad - VLC/libVLC live TV player."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Native VLC-backed player. iOS implementation uses MobileVLCKit.
  vlc_player: ^2.1.2

  http: ^1.2.2
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
