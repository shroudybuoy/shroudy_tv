name: shroudy_tv
description: "Shroudy TV iPad - VLC/libVLC live TV player."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # Native VLC-backed player. iOS implementation uses MobileVLCKit.
  vlc_player: ^2.1.2

  http: ^1.2.2
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8

  # App-scoped screen brightness for the left-side vertical drag gesture.
  # On iOS this maps to UIScreen.brightness; on Android it uses the
  # window's screenBrightness attribute. No Info.plist permission needed.
  screen_brightness: ^2.1.3
  screen_brightness_android: ^2.1.3
  screen_brightness_ios: ^2.1.3

  # Real device (system) volume control for the right-side vertical drag
  # gesture. On iOS this drives the hardware volume via MPVolumeView so the
  # gesture stays in sync with the physical buttons.
  flutter_volume_controller: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
