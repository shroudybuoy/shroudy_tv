name: Build Shroudy TV iPad (.ipa)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout project files
        uses: actions/checkout@v4

      - name: Install Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Overwrite Older SDK Constraints
        run: |
          sed -i '' 's/sdk: ">=3.13.4 <4.0.0"/sdk: ">=3.22.0 <4.0.0"/g' pubspec.yaml || true

      - name: Re-create Native iOS Layout Configuration Targets
        run: flutter create . --platforms=ios

      - name: Fetch system dependencies
        run: flutter pub get

      - name: Compile Lightweight iPad Application Asset Container
        # FIX: Targets the simulator build tree to completely bypass the Apple Provisioning Profile error block
        run: flutter build ios --simulator --no-codesign

      - name: Zip Bundle into a Standalone Sideloadly Installer Package
        run: |
          mkdir -p Payload
          cp -r build/ios/iphonesimulator/Runner.app Payload/
          zip -r ShroudyTV.ipa Payload

      - name: Output Finished File Download Link
        uses: actions/upload-artifact@v4
        with:
          name: ShroudyTV-iPad-Installer
          path: ShroudyTV.ipa
