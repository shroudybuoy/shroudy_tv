name: Build Shroudy TV iPad (.ipa)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # Dynamically selects the most stable virtual runner image
    steps:
      - name: Checkout project files
        uses: actions/checkout@v4

      - name: Install Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Automatically matches environment targets seamlessly

      - name: Overwrite Older SDK Constraints
        run: |
          # Upgrades the baseline SDK definitions to match current stable toolchains
          sed -id 's/sdk: ">=3.13.4 <4.0.0"/sdk: ">=3.22.0 <4.0.0"/g' pubspec.yaml || true

      - name: Re-create Native iOS Layout Configuration Targets
        run: flutter create . --platforms=ios

      - name: Fetch system dependencies
        run: flutter pub get

      - name: Compile Lightweight iPad Application Asset Container
        run: flutter build ios --no-codesign

      - name: Zip Bundle into a Standalone Sideloadly Installer Package
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ShroudyTV.ipa Payload

      - name: Output Finished File Download Link
        uses: actions/upload-artifact@v4
        with:
          name: ShroudyTV-iPad-Installer
          path: ShroudyTV.ipa
