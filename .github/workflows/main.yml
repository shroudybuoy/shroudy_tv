name: Build Shroudy TV iPad (.ipa)
on:
  workflow_dispatch: # Allows you to trigger the compilation manually with a single click

jobs:
  build:
    runs-on: macos-latest # Remote cloud server image builds the installer framework safely
    steps:
      - name: Checkout project files
        uses: actions/checkout@v4

      - name: Install Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.5'
          cache: true

      - name: Fetch system dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Compile Lightweight iPad Application Asset Container
        run: flutter build ios --release --no-codesign

      - name: Zip Bundle into a Standalone Sideloadly Installer Package
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ShroudyTV.ipa Payload

      - name: Output Finished File Download Link
        uses: actions/upload-artifact@v4
        with:
          name: ShroudyTV-iPad-Installer
          path: ShroudyTV.ipa
