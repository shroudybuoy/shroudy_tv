name: Build Shroudy TV iPad (.ipa)
on:
  workflow_dispatch: # Allows you to trigger the compilation manually with a single click

jobs:
  build:
    runs-on: macos-latest # Remote cloud server image builds the installer framework safely
    steps:
      - name: Checkout project files
        uses: actions/checkout@v4

      - name: Install Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Overwrite Older SDK Constraints
        run: |
          sed -i '' 's/sdk: ">=3.13.4 <4.0.0"/sdk: ">=3.22.0 <4.0.0"/g' pubspec.yaml || true

      - name: Re-create Native iOS Layout Configuration Targets
        run: flutter create . --platforms=ios

      - name: Inject Apple Transport Networking Exceptions
        run: |
          # Automatically injects network bypass permissions directly into Info.plist
          PLIST_PATH="ios/Runner/Info.plist"
          sed -i '' '/<dict>/a\
          <key>NSAppTransportSecurity</key>\
          <dict>\
              <key>NSAllowsArbitraryLoads</key>\
              <true/>\
          </dict>' "$PLIST_PATH"

      - name: Patch Hidden iOS Code-Signing Profile Rules
        run: |
          # Automatically strips out strict development team constraints so it compiles cleanly on cloud machines
          sed -i '' 's/DEVELOPMENT_TEAM = "";/CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Fetch system dependencies
        run: flutter pub get

      - name: Compile Lightweight iPad Application Asset Container
        run: flutter build ios --release --no-codesign

      - name: Zip Bundle into a Standalone Sideloadly Installer Package
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ShroudyTV.ipa Payload

      - name: Output Finished File Download Link
        uses: actions/upload-artifact@v4
        with:
          name: ShroudyTV-iPad-Installer
          path: ShroudyTV.ipa
