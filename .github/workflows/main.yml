name: Build Shroudy TV iPad (.ipa)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Uses an environment fully optimized for this Flutter target
    steps:
      - name: Checkout project files
        uses: actions/checkout@v4

      - name: Install Matching Flutter Compiler Framework
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.4' # FIX: Set to match your project's SDK constraint perfectly
          channel: 'stable'

      - name: Re-create Missing Native iOS Configuration Targets
        run: flutter create . --platforms=ios

      - name: Fetch system dependencies
        run: flutter pub get

      - name: Compile Lightweight iPad Application Asset Container
        run: flutter build ios --no-codesign

      - name: Zip Bundle into a Standalone Sideloadly Installer Package
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r ShroudyTV.ipa Payload

      - name: Output Finished File Download Link
        uses: actions/upload-artifact@v4
        with:
          name: ShroudyTV-iPad-Installer
          path: ShroudyTV.ipa
